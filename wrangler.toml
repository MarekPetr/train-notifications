name = "train-notifications"
main = "src/index.ts"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = true

[triggers]
# Every 2 minutes: check watches.
# 03:00 UTC: refresh stop catalog from KORDIS GTFS.
crons = ["*/2 * * * *", "0 3 * * *"]

[[kv_namespaces]]
binding = "WATCHES"
id = "32be688087a543128affb86fa91cf12e"
preview_id = "554e20aa885942e79d999f86b7e07bb0"

[[durable_objects.bindings]]
name = "APP_STORE"
class_name = "AppStore"

[[migrations]]
tag = "v1-app-store"
new_sqlite_classes = ["AppStore"]

[vars]
TZ = "Europe/Prague"
# Overridden on each `pnpm deploy` — bumps catalog rebuild.
DEPLOY_ID = "local-dev"
# Storage backend: "do" (Durable Object, default) or "kv" (Workers KV).
STORAGE_BACKEND = "do"

# Runs before `wrangler deploy` / `wrangler dev` (incl. Cloudflare Workers Builds).
[build]
command = "pnpm run build:web"

[assets]
directory = "./web/dist"
binding = "ASSETS"
run_worker_first = true
