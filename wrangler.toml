name = "train-notifications"
main = "src/index.ts"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Every 2 minutes: halves Free KV/API burn vs every minute; still fine for delays.
# 03:00 UTC: refresh stop catalog from KORDIS GTFS into KV.
crons = ["*/2 * * * *", "0 3 * * *"]

[[kv_namespaces]]
binding = "WATCHES"
id = "32be688087a543128affb86fa91cf12e"
preview_id = "554e20aa885942e79d999f86b7e07bb0"

[vars]
TZ = "Europe/Prague"
# Overridden on each `npm run deploy` — bumps catalog rebuild.
DEPLOY_ID = "local-dev"

[assets]
directory = "./docs"
binding = "ASSETS"
run_worker_first = true
